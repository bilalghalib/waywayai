<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#efefef">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <script src="js/eruda.js"></script>

    <script src="https://code.jquery.com/jquery-1.12.2.min.js"></script>
    <script src="js/require.js"></script>
    <script src="js/airtable.browser.js"></script>

    <link rel="stylesheet" href="./style.css">

    <title>Draw way way</title>
</head>

<body onload="getUrlParam()">

    <input type="text" placeholder="New photo URL or draw me :)" value="" id="imageURL" style=" width:165px;">

    <button type="button" onclick="updateImage();">Update</button>

    <input type="text" value="" id="imageWidth" style=" width:25px;">
    
    <button type="button" onclick="updateImageWidth();">Width</button>

    <input type="text" placeholder="Username (from wawyway.ai) (optional)" value="" id="uploaderEmail"
        style="width:120px;">
    <button type="button" id="uploadbutton" onclick="saveDynamicDataToFile();">Upload</button>

    <button type="button" onclick="clearDrawing();">Clear</button>

    <br />

    <img class="image1" id="photoToDraw" src="https://bilalghalib.com/does/wp-content/uploads/2020/08/B_headshot-1.jpg"
        width:642px; />

    <canvas class="canvasRelative" touch-action="none" id="board" width="640" height="640"
        style="width:320px; height:320px;">
        Oops, you cannot trace with this browser!
    </canvas>

    <script src="./js/scripts.js"></script>
    <script src="js/FileSaver.js"></script>
    <script src="js/upload.js"></script>
    <script src="https://cdn.jsdelivr.net/lodash/4.17.2/lodash.min.js"></script>
    <script src="js/vendors/pep.js"></script>
    <script src="js/libs/Board.js"></script>
    <script src="js/libs/Pointer.js"></script>
    <script src="js/libs/Pen.js"></script>
    <script src="js/libs/FloatingButton.js"></script>
    <script src="js/main.js"></script>
