<!-- https://draw.wayway.ai/ -->
<!DOCTYPE html>
<html>
<head>
    <!-- Title for the website -->
    <title>Draw way way</title>

    <meta http-equiv="Content-Type" content="text/html; charset=windows-1252">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#efefef">

    <link rel="shortcut icon" type="image/x-icon" href="https://draw.wayway.ai/favicon.ico">

    <!-- CSS files for the project -->
    <link rel="stylesheet" href="./Draw way way_files/css/main.css">
    <link rel="stylesheet" href="./Draw way way_files/css/main1.css">
    <link rel="stylesheet" href="./Draw way way_files/css/main2.css">
    <link rel="stylesheet" href="./Draw way way_files/css/main3.css">
    <link rel="stylesheet" href="./Draw way way_files/css/main4.css">

    <!-- Js initial files for the project -->
    <script src="./Draw way way_files/js/eruda.js"></script>
    <script src="./Draw way way_files/js/jquery-1.12.2.min.js"></script>
    <script src="./Draw way way_files/js/airtable.browser.js"></script>
    <script src="./Draw way way_files/js/airtable_builder.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.js" integrity="sha512-uKcuHr0POVc2zz1hMVTEiicF9G5SPq2k6l4xVmPeSXm8yH/rrM6ewau/Gn89ykaGrfMyhCBH4Vn/MDcS3Pccqw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

</head>

<body onload="getUrlParam()" data-new-gr-c-s-check-loaded="14.1076.0" data-gr-ext-installed="">
    <!-- Some update, Width, Upload, clear components for play drawings here -->
    <!-- Update feature -->
    <div class="input_block">
        <div class="input_block">
            <input type="text" placeholder="New photo URL or draw me :)" value="" id="imageURL" style=" width:165px;">
            <button type="button" onclick="updateImage();">Update</button>
        </div>
        <!-- Width feature -->
        <div class="input_block">
            <input type="text" value="" id="imageWidth" style=" width:25px;">
            <button type="button" onclick="updateImageWidth();">Width</button>
        </div>
        <!-- Upload and clear feature -->
        <div class="input_block">
            <input type="text" placeholder="Username (from wawyway.ai) (optional)" value="" id="uploaderEmail" style="width:120px;">
            <button type="button" id="uploadbutton" onclick="saveDynamicDataToFile();">Upload</button>
            <button type="button" onclick="clearDrawing();">Clear</button>
        </div>
    </div>

    <!-- Video component for play drawings -->
    <br>
    <!-- Forms for play feature -->
    <div class="drawing_div">
        <input type="text" placeholder="What are you gonna play? :)" value="https://dl.airtable.com/.attachments/00aaefeb8b44e148886288078a69f5aa/71745d34/rec3ZTgEBcWoJ8Wo9312487lin.txt" id="drawingURL" style=" width:165px;">
        <button type="button" onclick="runDrawing();" id="runDrawingBtn">&gt;</button>
        <button type="button" onclick="stopDrawing();" id="stopDrawingBtn">Stop</button>
        <p class="drawing_error_txt" id="statusText"></p>
    </div>

    <!-- Forms for speed feature -->
    <div class="drawing_speed_div">
        <label>Speed[1-10]: </label>
        <input type="number" placeholder="Enter the play speed" value="5" id="playSpeed" style="width:40px;" onchange="changeSpeed();" min="1" max="10">
    </div>
    <br>

    <!-- Image for headshot -->
    <img class="image1" id="photoToDraw" src="./Draw way way_files/assets/B_headshot-1.jpg" width="642">

    <!-- Here's the main canvas that we control everything -->
    <canvas class="canvasRelative" touch-action="none" id="board" width="2860" height="1444" style="width: 1430px; height: 722px;">
        Oops, you cannot trace with this browser!
    </canvas>

    <!-- Javascript files for the project -->
    <script src="./Draw way way_files/js/utilities.js"></script>
    <script src="./Draw way way_files/js/FileSaver.js"></script>
    <script src="./Draw way way_files/js/upload.js"></script>
    <script src="./Draw way way_files/js/lodash.min.js"></script>
    <script src="./Draw way way_files/js/pep.js"></script>
    <script src="./Draw way way_files/js/Board.js"></script>
    <script src="./Draw way way_files/js/Pointer.js"></script>
    <script src="./Draw way way_files/js/Pen.js"></script>
    <script src="./Draw way way_files/js/FloatingButton.js"></script>
    <script src="./Draw way way_files/js/main.js"></script>
</body>
</html>
